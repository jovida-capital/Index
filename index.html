<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jovida — mes applications</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jovida">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --fond:#14171C;
  --carte:#1E232A;
  --carte-survol:#252B33;
  --trait:#2E353E;
  --texte:#EEEDE5;
  --texte-doux:#9CA6AD;
  --focus:#B8722E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--fond);
  color:var(--texte);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  padding:calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
}
main{max-width:460px;margin:0 auto;}
h1{font-size:15px;font-weight:600;letter-spacing:0.2px;margin:0 0 4px;color:var(--texte-doux);}
.date{font-size:26px;font-weight:600;margin:0 0 32px;}
.applis{display:flex;flex-direction:column;gap:12px;}
a.appli{
  display:flex;align-items:center;gap:16px;
  background:var(--carte);border:1px solid var(--trait);border-radius:16px;
  padding:16px 18px;text-decoration:none;color:inherit;
}
a.appli:hover{background:var(--carte-survol);}
a.appli:active{transform:scale(0.99);}
a.appli:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
a.appli img{width:56px;height:56px;border-radius:14px;flex-shrink:0;background:#0a0c0f;}
.nom{font-size:17px;font-weight:600;}
.desc{font-size:13.5px;color:var(--texte-doux);margin-top:2px;line-height:1.4;}
.initiale{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#2E353E;color:var(--texte);font-size:24px;font-weight:600;
}
.fleche{margin-left:auto;color:var(--texte-doux);font-size:20px;flex-shrink:0;}
.aide{margin-top:28px;font-size:12.5px;color:var(--texte-doux);line-height:1.5;}
</style>
</head>
<body>
<main>
  <h1>Jovida</h1>
  <p class="date" id="date"></p>
  <nav class="applis" aria-label="Applications">
    <a class="appli" href="/FinVault/">
      <img src="/FinVault/icon-192.png" alt="" data-initiale="F">
      <div>
        <div class="nom">FinVault</div>
        <div class="desc">Patrimoine, investissements, impôts et virements</div>
      </div>
      <span class="fleche" aria-hidden="true">›</span>
    </a>
    <a class="appli" href="/maillage/">
      <img src="/maillage/icon-192.png" alt="" data-initiale="M">
      <div>
        <div class="nom">Maillage</div>
        <div class="desc">Recherche d'emploi : pistes, contacts et actions</div>
      </div>
      <span class="fleche" aria-hidden="true">›</span>
    </a>
    <a class="appli" href="/emploi_domicile/">
      <img src="icon-emploi-domicile.png" alt="" data-initiale="E">
      <div>
        <div class="nom">Emploi à domicile</div>
        <div class="desc">Gestion de l'emploi à domicile</div>
      </div>
      <span class="fleche" aria-hidden="true">›</span>
    </a>
  </nav>
  <p class="aide">Revenez ici avec le geste retour. Un appui long sur l'icône Jovida ouvre directement l'une des applications.</p>
</main>
<script>
const d = new Date();
const txt = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('date').textContent = txt.charAt(0).toUpperCase() + txt.slice(1);

// Si une application n'a pas d'icône à l'adresse attendue, on affiche son initiale.
document.querySelectorAll('img[data-initiale]').forEach(img=>{
  const remplacer = ()=>{
    const s = document.createElement('span');
    s.className = 'initiale'; s.setAttribute('aria-hidden','true');
    s.textContent = img.dataset.initiale;
    img.replaceWith(s);
  };
  if(img.complete && img.naturalWidth === 0) remplacer();
  else img.addEventListener('error', remplacer);
});

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Service worker refusé', err));
  });
}
</script>
</body>
</html>
