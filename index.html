<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jovida Capital — Registre des dépôts</title>
<meta name="robots" content="noindex, nofollow">
<style>#app{display:none}#login{display:flex}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--surface:#111318;--surface2:#181b22;--border:#1e2230;
  --accent:#c8f04a;--accent2:#4af0c8;
  --text:#e8ecf0;--muted:#8892a0;--muted2:#c8d0dc;--neg:#f04a7a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}

/* ── LOGIN ── */
#login{position:fixed;inset:0;z-index:1000;background:var(--bg);align-items:center;justify-content:center;overflow:auto;}
.login-card{width:360px;max-width:95vw;background:var(--surface);border:1px solid var(--border);padding:40px;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;}
.login-logo span{color:var(--accent);}
.login-sub{color:var(--muted2);font-size:13px;margin-bottom:32px;}
.login-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px;display:block;}
.login-in{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:15px;padding:11px 14px;outline:none;transition:border-color .2s;}
.login-in:focus{border-color:var(--accent);}
.login-err{color:var(--neg);font-size:12px;margin-top:6px;min-height:16px;}
.login-btn{width:100%;margin-top:20px;background:var(--accent);color:#0a0c0f;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:13px;transition:opacity .2s;}
.login-btn:hover{opacity:.85;}
.login-back{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:12px;display:block;}
.login-back:hover{color:var(--muted2);}

/* ── APP ── */
.wrap{max-width:820px;margin:0 auto;padding:56px 24px 90px;}
.masthead{border-bottom:1px solid var(--border);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.masthead h1{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.4px;margin-bottom:5px;}
.masthead h1 span{color:var(--accent);}
.masthead p{color:var(--muted2);font-size:13px;}
.masthead .count{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent2);white-space:nowrap;}
.logout{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;margin-top:6px;}
.logout:hover{color:var(--neg);}

.controls{display:flex;justify-content:space-between;gap:10px;margin:20px 0 4px;flex-wrap:wrap;}
.controls input,.controls select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 11px;outline:none;}
.controls input{width:230px;}
.controls input:focus,.controls select:focus{border-color:var(--accent);}
.controls input::placeholder{color:var(--muted);}
.controls select{color:var(--muted2);}
.controls select option{background:var(--surface);}

.ledger{border-top:1px solid var(--border);margin-top:16px;}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 16px;padding:17px 6px;border-bottom:1px solid rgba(30,34,48,.7);text-decoration:none;color:inherit;transition:background .15s;}
.row:hover{background:rgba(255,255,255,.02);}
.row .name{font-family:'DM Mono',monospace;font-size:14px;color:var(--text);}
.row .updated{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;}
.row .desc{grid-column:1/-1;font-size:14px;color:var(--muted2);line-height:1.55;max-width:64ch;}
.row .meta{grid-column:1/-1;display:flex;gap:14px;align-items:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}
.lang{display:inline-flex;align-items:center;gap:6px;}
.lang .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

.state{padding:36px 6px;color:var(--muted2);font-size:14px;}
.state.error{color:var(--neg);}

footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
footer a{color:var(--accent2);text-decoration:none;}

@media(max-width:560px){
  .wrap{padding:36px 16px 60px;}
  .masthead h1{font-size:23px;}
  .row{grid-template-columns:1fr;}
  .row .updated{text-align:left;}
  .controls input{width:100%;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">Jovida<span>Capital</span></div>
    <div class="login-sub" id="login-sub">Accès au registre des dépôts</div>

    <!-- Connexion -->
    <div id="blk-pwd">
      <label class="login-lbl">Mot de passe</label>
      <input type="password" class="login-in" id="inp-pwd" placeholder="••••••••" autocomplete="current-password">
      <div class="login-err" id="err-pwd"></div>
      <button class="login-btn" onclick="doStep1()">Accéder →</button>
      <button class="login-back" onclick="resetPwd()">Réinitialiser le mot de passe</button>
    </div>

    <!-- Premier lancement -->
    <div id="blk-setup" style="display:none">
      <label class="login-lbl">Choisir un mot de passe</label>
      <input type="password" class="login-in" id="inp-new" placeholder="••••••••" autocomplete="new-password">
      <label class="login-lbl" style="margin-top:14px">Confirmer</label>
      <input type="password" class="login-in" id="inp-new2" placeholder="••••••••" autocomplete="new-password">
      <div class="login-err" id="err-new"></div>
      <button class="login-btn" onclick="doSetup()">Activer →</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="wrap">
    <header class="masthead">
      <div>
        <h1>Jovida<span>Capital</span></h1>
        <p>Registre des dépôts — github.com/Jovida-capital</p>
        <button class="logout" onclick="doLogout()">Déconnexion</button>
      </div>
      <div class="count" id="count">chargement…</div>
    </header>

    <div class="controls">
      <input type="text" id="search" placeholder="filtrer par nom ou description">
      <select id="sort">
        <option value="updated">Trier — dernière activité</option>
        <option value="name">Trier — nom</option>
        <option value="stars">Trier — étoiles</option>
      </select>
    </div>

    <div class="ledger" id="ledger">
      <div class="state" id="state">Chargement du registre…</div>
    </div>

    <footer>
      Données récupérées via l'API GitHub. <a href="https://github.com/Jovida-capital" target="_blank" rel="noopener">Profil complet</a>
    </footer>
  </div>
</div>

<script>
/* ═══ AUTH ═══
   Rien à configurer : au premier lancement, la page demande de définir
   un mot de passe. Son empreinte SHA-256 est conservée dans le navigateur.
*/
const STORE_KEY   = "jv_repos_pwd";
const SESSION_KEY = "jv_repos_auth";

async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function showBlock(id){
  ['blk-pwd','blk-setup'].forEach(b =>
    document.getElementById(b).style.display = (b === id ? 'block' : 'none'));
}

async function doSetup(){
  const p1 = document.getElementById('inp-new').value;
  const p2 = document.getElementById('inp-new2').value;
  const err = document.getElementById('err-new');
  if(p1.length < 8){ err.textContent = "Au moins 8 caractères."; return; }
  if(p1 !== p2){ err.textContent = "Les deux saisies diffèrent."; return; }
  const h = await sha256(p1);
  localStorage.setItem(STORE_KEY, h);
  sessionStorage.setItem(SESSION_KEY, h);
  unlock();
}

async function doStep1(){
  const pwd = document.getElementById('inp-pwd').value;
  const err = document.getElementById('err-pwd');
  if(!pwd){ err.textContent = "Saisir un mot de passe."; return; }
  const h = await sha256(pwd);
  if(h === localStorage.getItem(STORE_KEY)){
    sessionStorage.setItem(SESSION_KEY, h);
    unlock();
  } else {
    err.textContent = "Mot de passe incorrect.";
    document.getElementById('inp-pwd').value = "";
  }
}

function resetPwd(){
  if(!confirm("Réinitialiser le mot de passe de ce navigateur ?")) return;
  localStorage.removeItem(STORE_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

function unlock(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  load();
}

function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

['inp-pwd','inp-new','inp-new2'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => {
    if(e.key === 'Enter') (id === 'inp-pwd' ? doStep1() : doSetup());
  }));

// Routage au chargement
const stored = localStorage.getItem(STORE_KEY);
if(!stored){
  document.getElementById('login-sub').textContent = "Première connexion — définir un mot de passe";
  showBlock('blk-setup');
  document.getElementById('inp-new').focus();
} else if(sessionStorage.getItem(SESSION_KEY) === stored){
  unlock();
} else {
  document.getElementById('inp-pwd').focus();
}

/* ═══ REGISTRE DES DÉPÔTS ═══ */
const USERNAME = "Jovida-capital";
let repos = [];

const ledgerEl = document.getElementById("ledger");
const stateEl  = document.getElementById("state");
const countEl  = document.getElementById("count");
const searchEl = document.getElementById("search");
const sortEl   = document.getElementById("sort");

function formatDate(iso){
  return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  let list = repos.filter(r =>
    r.name.toLowerCase().includes(q) || (r.description||"").toLowerCase().includes(q)
  );

  const s = sortEl.value;
  if(s === "name")       list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s === "stars") list.sort((a,b)=>b.stargazers_count-a.stargazers_count);
  else                   list.sort((a,b)=>new Date(b.pushed_at)-new Date(a.pushed_at));

  ledgerEl.innerHTML = "";

  if(!list.length){
    const e = document.createElement("div");
    e.className = "state";
    e.textContent = "Aucun dépôt ne correspond à ce filtre.";
    ledgerEl.appendChild(e);
    return;
  }

  list.forEach(r => {
    const a = document.createElement("a");
    a.className = "row"; a.href = r.html_url; a.target = "_blank"; a.rel = "noopener";

    const n = document.createElement("div");
    n.className = "name"; n.textContent = r.name;

    const u = document.createElement("div");
    u.className = "updated"; u.textContent = formatDate(r.pushed_at);

    a.appendChild(n); a.appendChild(u);

    if(r.description){
      const d = document.createElement("div");
      d.className = "desc"; d.textContent = r.description;
      a.appendChild(d);
    }

    const m = document.createElement("div");
    m.className = "meta";
    let html = "";
    if(r.language) html += `<span class="lang"><span class="dot"></span>${r.language}</span>`;
    html += `<span>${r.stargazers_count} étoile${r.stargazers_count===1?"":"s"}</span>`;
    html += `<span>${r.forks_count} fork${r.forks_count===1?"":"s"}</span>`;
    m.innerHTML = html;
    a.appendChild(m);

    ledgerEl.appendChild(a);
  });
}

async function load(){
  try{
    let page = 1, all = [];
    while(true){
      const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=pushed`);
      if(!res.ok) throw new Error(res.status === 403
        ? "Limite de requêtes GitHub atteinte. Réessayer dans quelques minutes."
        : `Erreur ${res.status}`);
      const data = await res.json();
      all = all.concat(data);
      if(data.length < 100) break;
      page++;
    }
    repos = all;
    countEl.textContent = `${repos.length} dépôt${repos.length===1?"":"s"}`;
    render();
  }catch(err){
    stateEl.classList.add("error");
    stateEl.textContent = err.message || "Impossible de charger les dépôts.";
    countEl.textContent = "";
  }
}

searchEl.addEventListener("input", render);
sortEl.addEventListener("change", render);
</script>
</body>
</html>
